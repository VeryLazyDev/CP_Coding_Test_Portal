openapi: 3.0.3
info:
    title: CP Coding Test
    version: 1.0.0
    description: API documentation for CP Coding Test

paths:
    /api/v1/admin/auth/register:
        post:
            summary: Register a new user
            description: >
                Creates a new user account.
                Only users with an **Admin** role (validated via Bearer token) can register new users.
            tags:
                - Account Creation
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - name
                                - email
                                - username
                                - password
                                - teamId
                                - roleId
                            properties:
                                name:
                                    type: string
                                    example: Bruce Wayne
                                email:
                                    type: string
                                    format: email
                                    example: bruce@waynecorp.com
                                username:
                                    type: string
                                    example: batman
                                password:
                                    type: string
                                    format: password
                                    example: iambatman123
                                teamId:
                                    type: integer
                                    example: 2
                                roleId:
                                    type: integer
                                    example: 1
            responses:
                "200":
                    description: User successfully created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        example: ok
                                    data:
                                        type: object
                                        properties:
                                            newUser:
                                                type: object
                                                properties:
                                                    id:
                                                        type: integer
                                                        example: 5
                                                    name:
                                                        type: string
                                                        example: Bruce Wayne
                                                    username:
                                                        type: string
                                                        example: batman
                                                    email:
                                                        type: string
                                                        example: bruce@waynecorp.com
                                                    teamId:
                                                        type: integer
                                                        example: 2
                                                    roleId:
                                                        type: integer
                                                        example: 1
                "400":
                    description: Invalid authorization header or token format
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: string
                                        example: Invalid authorization header format
                "401":
                    description: Unauthorized request (missing or invalid token)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: string
                                        example: Only admin can create account
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: string
                                        example: "Internal Server Error: Something went wrong"

    /api/v1/admin/auth/login:
        post:
            summary: Admin login
            description: Authenticates the admin and returns a JWT token if credentials are valid.
            tags:
                - Authentication
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - username
                                - password
                            properties:
                                username:
                                    type: string
                                    example: admin
                                password:
                                    type: string
                                    example: admin12345
            responses:
                "200":
                    description: Login response with JWT token or failure message
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    token:
                                        type: string
                                        description: JWT token
                                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                                    msg:
                                        type: string
                                        example: Login Success
                "400":
                    description: Missing or invalid request body
                "401":
                    description: Invalid username or password

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
